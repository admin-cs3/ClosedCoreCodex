<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UEFI / EFI — ClosedCoreCodex</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      background: #090817;
      color: #f4edff;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 1000px;
      margin: auto;
    }
    h1 { color: #d8b4fe; }
    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 28px;
    }
    figure {
      margin: 0;
      padding: 16px;
      background: #17132b;
      border: 1px solid #62458c;
      border-radius: 14px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    figcaption {
      padding-top: 12px;
      color: #e9d5ff;
    }
    a { color: #d8b4fe; }
    .back { display: inline-block; margin-bottom: 20px; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← Terug naar ClosedCoreCodex</a>
    <h1>UEFI / EFI</h1>
    <p>Moderne firmware en het opstartproces.</p>

    <div class="photos">
      <figure>
        <a href="static/images/phounixbios.png" target="_blank">
          <img src="static/images/phounixbios.png" alt="Phoenix BIOS">
        </a>
        <figcaption>Phoenix BIOS</figcaption>
      </figure>
      <figure>
        <a href="static/images/uefi.png" target="_blank">
          <img src="static/images/uefi.png" alt="UEFI firmware">
        </a>
        <figcaption>UEFI / EFI</figcaption>
      </figure>
    </div>
