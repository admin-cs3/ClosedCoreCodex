<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCore — ClosedCoreCodex</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      background: #090817;
      color: #f4edff;
      font-family: Arial, sans-serif;
    }
    main { max-width: 1000px; margin: auto; }
    h1 { color: #d8b4fe; }
    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 28px;
    }
    figure {
      margin: 0;
      padding: 16px;
      background: #17132b;
      border: 1px solid #62458c;
      border-radius: 14px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    figcaption { padding-top: 12px; color: #e9d5ff; }
    a { color: #d8b4fe; }
    .back { display: inline-block; margin-bottom: 20px; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← Terug naar ClosedCoreCodex</a>
    <h1>OPENCORE</h1>
    <h2>macOS Bootloader</h2>
    <p>EFI, config.plist en hardwarecompatibiliteit.</p>

    <div class="photos">
      <figure>
        <a href="static/images/opencorgui.jpg" target="_blank">
          <img src="static/images/opencorgui.jpg" alt="OpenCore GUI">
        </a>
        <figcaption>OpenCore GUI</figcaption>
      </figure>
      <figure>
        <a href="static/images/appleboot.png" target="_blank">
          <img src="static/images/appleboot.png" alt="Apple boot">
        </a>
        <figcaption>Apple Boot</figcaption>
      </figure>
    </div>
  </main>
